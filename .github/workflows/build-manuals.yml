name: Build manuals

on:
  push:
    tags: ['**']
  # Only merged, trusted base-branch code runs; this also supports merges from forks.
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-manuals
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    environment: agent
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A tag builds that exact version; merged PRs build their current base branch.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the merged PR requires a build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          has_work=true
          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            source_files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | select((.filename | startswith("public/") | not) or ((.previous_filename // .filename) | startswith("public/") | not)) | .filename')
            if [[ -z "$source_files" ]]; then has_work=false; fi
          fi
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.has_work == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.plan.outputs.has_work == 'true'
        run: npm ci --include=dev

      - name: Validate manuals
        if: steps.plan.outputs.has_work == 'true'
        run: npm run manual:check

      - name: Install Chromium for PDF generation
        if: steps.plan.outputs.has_work == 'true'
        run: npm run browser:install -- --with-deps --only-shell

      - name: Build all manuals and refresh public deployment
        id: build
        if: steps.plan.outputs.has_work == 'true'
        run: npm run build

      - name: Save the generated public site in Git
        id: save
        if: steps.plan.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        shell: bash
        run: |
          if [[ "$REF_TYPE" == 'tag' ]]; then
            save_branch="automation/builds/$REF_NAME"
          else
            save_branch="automation/build-manuals/$BASE_BRANCH"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$save_branch"
          git add -- public/
          if git diff --cached --quiet; then
            echo 'The generated public site is already committed.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Rebuild public manuals and PDF downloads'
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$save_branch"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Tagged builds remain attached to their version; they do not replace newer branch content.
          if [[ "$REF_TYPE" != 'tag' ]]; then
            body_file="$RUNNER_TEMP/manual-build-pr.md"
            cat > "$body_file" <<'BODY'
          Refreshes the versioned `public/` site and PDF downloads from the current manual sources. This workflow uses no OpenAI API calls or credentials.

          Validation: manual checks, translation structure checks, screenshot checks and the complete `npm run build`.
          BODY
            pr_url=$(gh pr list --base "$BASE_BRANCH" --head "$save_branch" --state open --json url --jq '.[0].url // empty')
            if [[ -z "$pr_url" ]]; then
              pr_url=$(gh pr create --base "$BASE_BRANCH" --head "$save_branch" \
                --title 'Rebuild public manuals and PDF downloads' --body-file "$body_file")
            else
              gh pr edit "$pr_url" --body-file "$body_file"
            fi
            echo "pull_request_url=$pr_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish build summary
        if: always()
        env:
          HAS_WORK: ${{ steps.plan.outputs.has_work }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          SAVE_RESULT: ${{ steps.save.outcome }}
          COMMIT_SHA: ${{ steps.save.outputs.commit_sha }}
          PR_URL: ${{ steps.save.outputs.pull_request_url }}
        shell: bash
        run: |
          printf '## Manual build\n\n| Step | Result |\n| --- | --- |\n| Build | %s |\n| Save to Git | %s |\n' \
            "$BUILD_RESULT" "$SAVE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$HAS_WORK" == 'false' ]]; then
            printf '\nSkipped: this merge only changed generated public files.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$COMMIT_SHA" ]]; then
            printf '\nBuild saved in Git: %s/%s/commit/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$PR_URL" ]]; then
            printf '\nBuild pull request: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated site and build reports
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: manual-build
          path: |
            public/
            output/pdf/**/report.json
            output/translations/coverage.json
          include-hidden-files: true
          retention-days: 14
